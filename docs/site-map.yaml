# site-map.yaml v2
# JOSYN Documentation Site Map
# ─────────────────────────────────────────────────────────────────────────────
# Controls how the site-assembler builds the staging folder for doc-generator.
#
# RULE EVALUATION ORDER:
#   1. overrides — matching repo+path with skip: true excludes a doc entirely
#   2. overrides — matching repo+path with to: places a doc at that exact tree path
#   3. mapping   — first matching rule with skip: true excludes a doc entirely
#   4. mapping   — first matching rule with to: places a doc at the mapped tree path
#   5. catch-all — docs matching no override or mapping land in the catch-all node
#
# RULE MATCHING:
#   - Fields within a rule object are AND
#   - Multiple rule objects in a list are OR
#   - String values support wildcard * (e.g. "josyn-foundation*")
#
# SOURCE FILE RESOLUTION:
#   Each doc is resolved as: {repos-root}\{repo}\{path}
#   e.g. C:\DevGit\josyn-platform\architecture\overview.md

# ── Site ──────────────────────────────────────────────────────────────────────

site:
  title: "JOSYN Documentation"
  docs-index: "C:/DevGit/josyn-platform/docs/docs-index.json"
  repos-root: "C:/DevGit"
  output: "C:/DevGit/josyn-docs"
  staging: "C:/DevGit/temp/josyn-site-staging"

# ── Tree ──────────────────────────────────────────────────────────────────────
# Human-authored folder hierarchy for the staging directory and navigation.

tree:
  - architecture:
      - platform
      - solution-architecture
      - components
      - decisions:
          - platform
          - backend     
  - reference
  - repos
  - guides
  - notes
  - unsorted:
      catch-all: true

# ── Mapping ───────────────────────────────────────────────────────────────────
# Evaluated top-to-bottom. First matching rule wins.
# 'to' is the tree path in the staging directory.
# 'skip: true' excludes matching docs entirely.

mapping:
  - { type: agent-instruction, skip: true }
  - { state: superseded, skip: true }
  - { repo: josyn-playground, skip: true }
  - { type: solution-architecture, to: architecture/solution-architecture }
  - { type: architecture-overview, to: architecture/platform }
  - { type: architecture-detail, to: architecture/platform }
  - { type: component-architecture, to: architecture/components }
  - { type: overview, folder-context: solution-architecture, to: architecture/solution-architecture }
  - { type: decision, folder-context: decisions, to: architecture/decisions/platform }
  - { type: decision, folder-context: repos, to: architecture/decisions/backend }
  - { type: decision, to: architecture/decisions/platform }
  - { type: reference, to: reference }
  - { type: repo-summary, to: repos }
  - { type: overview, folder-context: "", to: repos }
  - { type: overview, folder-context: "josyn-foundation*", to: repos }
  - { type: overview, folder-context: "josyn-jap*", to: repos }
  - { type: manual, to: guides }
  - { type: overview, to: guides }
  - { type: working-note, to: notes }
  - { type: plan, to: notes }

# ── Overrides ────────────────────────────────────────────────────────────────
# Per-file exceptions. Applied before mapping rules.
# 'to' is the tree path relative to the staging root.
# 'skip: true' excludes a specific doc even if it matched mapping rules.
#
# Example:
#   - { repo: josyn-platform, path: README.md, to: repos }
#   - { repo: josyn-platform, path: MAINTAINERS.md, skip: true }

overrides: []

# ── Reading Paths ─────────────────────────────────────────────────────────────
# Shown on the generated landing page as "who are you?" cards.
# Hand-curated: short (3–5 links), ordered by recommended reading sequence.
#
# link types:
#   { repo: x, path: y }   — link to a specific indexed doc
#   { section: x }         — link to a section by its folder name

reading-paths:

  - perspective: stakeholder
    label: "Stakeholder"
    intro: "Understand what JOSYN is and where it is heading."
    links:
      - { repo: josyn-platform, path: README.md }
      - { repo: josyn-platform, path: ROADMAP.md }

  - perspective: maintainer-architect
    label: "Maintainer — Architect"
    intro: "You design the platform and govern its decisions."
    links:
      - { repo: josyn-platform, path: architecture/overview.md }
      - { section: architecture/decisions }
      - { repo: josyn-platform, path: ROADMAP.md }

  - perspective: maintainer-developer
    label: "Maintainer — Developer"
    intro: "You work inside the platform repos. Start with the standards, then explore the repo summaries."
    links:
      - { repo: josyn-platform, path: architecture/coding-standards.md }
      - { repo: josyn-platform, path: architecture/naming-conventions.md }
      - { repo: josyn-platform, path: architecture/overview.md }
      - { section: repos }

  - perspective: maintainer-operator
    label: "Maintainer — Operator"
    intro: "You deploy, configure, and monitor the platform."
    links:
      - { repo: josyn-platform, path: architecture/storage.md }
      - { repo: josyn-platform, path: architecture/local-build.md }

  - perspective: job-developer
    label: "Job Developer"
    intro: "You write jobs that run on the JOSYN platform."
    links:
      - { section: guides }
      - { section: repos }
